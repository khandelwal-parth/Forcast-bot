<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quant Bot{% endblock %}</title>
    <meta name="description" content="Look up a US or Indian stock: chart signals, company numbers and a tested 5-day model outlook.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){var t;try{t=localStorage.getItem('qb-theme')}catch(e){}if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t})();</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
        <div class="wrap top-in">
            <a class="brand" href="/">
                <svg class="mark" viewBox="0 0 26 18" aria-hidden="true"><path pathLength="1" d="M2 14 L9 7 L14 11 L24 2"/></svg>
                Quant Bot
            </a>
            <div class="top-right">
                <nav aria-label="Main">
                    <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Analyze</a>
                    <a href="/accuracy" {% if request.path == '/accuracy' %}aria-current="page"{% endif %}>Scorecard</a>
                </nav>
                <button class="theme" id="themeBtn" type="button" aria-label="Switch color theme">
                    <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
                    <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main id="main">
        {% block content %}{% endblock %}
    </main>

    <div class="foot-wrap">
        <footer class="wrap foot">
            <p>For learning and research only, not financial advice. Prices come from Yahoo Finance and can be delayed. Past patterns do not guarantee future results.</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
